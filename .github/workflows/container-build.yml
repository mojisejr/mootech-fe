name: container-build
# Proves the image still builds from this revision and is hygienic (mumate-infra-move-001 slice 1). Runs
# scripts/container-smoke.sh --no-db — the SAME script a developer runs locally — so CI and a laptop cannot
# disagree about what "the image builds" means. The database + maintenance legs need the arena and run
# locally before a PR is marked ready; CI says so explicitly instead of printing a green it did not earn.
#
# 🔴 This is the first live workflow since #321 archived ci.yml (CI minutes are paid — mootech-fe#318). One job,
# no registry login unless push=true, and it does not replace the .githooks/pre-push lane.
# The postbuild gates inside the image build see CI=true: check-omise-key-inlined.sh therefore needs a value
# and gets a test-shaped placeholder from the smoke script — it proves the SHAPE inlines, not a deploy key.
# MANUAL ONLY (owner decision 2026-09-19): the launch lane must not see this job on its pull requests and CI
# minutes are paid. Run it from the Actions tab when a container change needs a second machine's proof, or with
# push=true to publish ghcr.io/mojisejr/mootech-fe:<sha> for the control room (mumate-infra-move-001 slice 3;
# tag = the exact commit, never latest — #637 §8.3). GITHUB_TOKEN with packages:write is enough for GHCR on
# this repository; no PAT, no secret added. Default input is false, so a plain dispatch changes nothing.
on:
  workflow_dispatch:
    inputs:
      push:
        description: "push ghcr.io/mojisejr/mootech-fe:<sha>[-target] (owner decision per slice; false = build + smoke only)"
        type: boolean
        default: false
      target:
        description: "which public values to inline (GitHub Environment variables): staging -> tag <sha>-staging, production -> tag <sha>"
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    # Environment variables (Settings -> Environments -> staging|production -> Variables) hold the PUBLIC values Next
    # inlines at build time; they are hostnames and publishable keys, never secrets. Referencing the environment
    # creates it on first use.
    environment: ${{ inputs.target || 'staging' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build + hygiene (no database in CI)
        run: bash scripts/container-smoke.sh --no-db
      - name: login to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: release build for ${{ inputs.target }} (Next inlines NEXT_PUBLIC_* at build time, so the smoke image cannot ship) + push by SHA
        if: ${{ inputs.push }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          suffix=""; [ "${{ inputs.target }}" = production ] || suffix="-${{ inputs.target }}"
          dst="ghcr.io/mojisejr/mootech-fe:${sha}${suffix}"
          # same Dockerfile the smoke just proved; only the public build values differ (tag = exact commit [+ target], never latest)
          docker build --build-arg "APP_GIT_SHA=${sha}" \
            --build-arg NEXTAUTH_URL="${{ vars.NEXTAUTH_URL }}" \
            --build-arg HOST="${{ vars.HOST }}" \
            --build-arg NEXT_PUBLIC_BACKEND_URL="${{ vars.NEXT_PUBLIC_BACKEND_URL }}" \
            --build-arg NEXT_PUBLIC_OMISE_KEY="${{ vars.NEXT_PUBLIC_OMISE_KEY }}" \
            --build-arg NEXT_PUBLIC_OMISE_KEY_V2="${{ vars.NEXT_PUBLIC_OMISE_KEY_V2 }}"\
            --build-arg NEXT_PUBLIC_ENABLE_CHAT="${{ vars.NEXT_PUBLIC_ENABLE_CHAT }}" \
            --build-arg NEXT_PUBLIC_VAPID_PUBLIC_KEY="${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}" \
            --build-arg NEXT_PUBLIC_WHATIF_API_URL="${{ vars.NEXT_PUBLIC_WHATIF_API_URL }}" \
            -t "$dst" . | tail -3
          docker push "$dst"
          echo "pushed $dst (target=${{ inputs.target }})" >> "$GITHUB_STEP_SUMMARY"
