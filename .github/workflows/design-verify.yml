name: design-verify
# CP-6 · evidence-as-gate. Runs the Frame-v2 UI harness on PRs that touch the v2 splash surface and
# blocks on: blind mutant (teeth) · block-anchor fail · blocking L3 drift · state break.
#
# Unlike the auth e2e (local-only — it needs BE + Supabase, see e2e/README.md), the splash harness is
# FE-ONLY: `next build && next start` + the v2 preview cookie, no backend. So it CAN run in CI without
# violating the Browser Truth doctrine. Separate job from `ci.yml` hard-gate — does not change it.
on:
  pull_request:
    paths:
      - "pages/v2/**"
      - "features/**"
      - "harness/**"
      - "design.contract.ts"
      - "design.reference.ts"
      - "tailwind.config.ts" # the features/ content-glob gap lived here — the whole silent-class family
      - "postcss.config.*"
      - ".github/workflows/design-verify.yml"

permissions:
  contents: read

concurrency:
  group: design-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  splash-harness:
    runs-on: ubuntu-latest
    env:
      # Not a secret — the v2 preview gate value; the harness sets the matching v2_access cookie.
      V2_PREVIEW_KEY: lamun-ci-preview
      # Build + RUNTIME placeholders only (mirrors ci.yml) — NO real secrets in CI.
      ENVIRONMENT: production
      HOST: https://example.invalid
      NEXTAUTH_URL: http://localhost:3000
      # next start (production) enforces NextAuth's secret at RUNTIME; without it every page
      # request logs MissingSecretError → console noise that breaks the state gate. Placeholder only.
      NEXTAUTH_SECRET: ci-placeholder-not-a-real-secret
      OMISE_PUBLIC_KEY: pkey_test_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: install chromium
        run: npx playwright install --with-deps chromium

      - name: build
        run: npm run build

      - name: run splash harness + pixel lens + calendar-month anchor (evidence-as-gate)
        run: |
          npx next start -p 3000 &
          SERVER=$!
          echo "waiting for :3000 …"
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://localhost:3000/v2 && break
            sleep 2
          done
          # screen gate (4-layer + mutant) then the pixel lens (visual ground-truth, same server)
          HARNESS_HOST=http://localhost:3000 npx tsx harness/run.ts
          CODE=$?
          HARNESS_HOST=http://localhost:3000 npx tsx harness/run-pixel.ts
          PCODE=$?
          # ปฏิทินดวง month anchor (บอง 2026-08-05): this file EXISTED for weeks with NOTHING running it —
          # not run.ts, not an npm script, not a workflow. "the calendar has a browser gate" therefore meant
          # "the calendar has no gate" (the #179 shape). μุน ran all three calendar anchors against main
          # fd41e02 to get real numbers before wiring: month PASSED (tier-fidelity 31/31 · exactly 1 sapphire
          # selected cell · 2 วันพระ rings · no-overflow at 320/360/393 · mutant mut-hardcode-tier CAUGHT),
          # so it can be wired NOW without blocking anyone. run-calendar-day and run-calendar-fidelity were
          # RED — for a KNOWN reason (they never sign in as a PAID user, so the tier gate hides the content
          # they assert on). They were MOVED to harness/archive/ 2026-08-07 (goo · harness-tidy ใบ ข): moved
          # because NOTHING ran them — NOT because they were fixed (still red at the move). There is no
          # "repair PR" (the earlier claim named one that does not exist); see harness/archive/README.md.
          # Wiring only the green one is the point: a gate you cannot run is not a gate.
          HARNESS_HOST=http://localhost:3000 npx tsx harness/run-calendar-month.ts
          MCODE=$?
          # M-A/M-B select + body states (ตู๋ 2026-08-06): #189 shipped a ledger entry whose enforced_by
          # pointed at this file while NOTHING ran it — the ledger was promising a guard that did not exist,
          # the same shape บอง hit in #185. Wired in #190 rather than in its own PR so that run proved it
          # green before merge. It is backend-independent by construction: every call it needs (/api/user,
          # /api/v2/calendar-month) is stubbed via Playwright route interception, so a CI box with no bazi
          # behind it exercises exactly what the anchor owns.
          # run-calendar-flow.ts was never wired: run against a dev server with no backend it goes RED at
          # "the grid actually rendered cells — 0 cells", because the month view has been real-pipe since
          # #186 and that anchor stubs nothing. It was MOVED to harness/archive/ 2026-08-07 (goo · harness-tidy)
          # — intended-but-never-wired: it needs a stub (route interception, like run-calendar-month) before
          # it can run. See harness/archive/README.md.
          HARNESS_HOST=http://localhost:3000 npx tsx harness/run-calendar-select.ts
          SCODE=$?
          # ── P3 home chart-cache WIRING gate (goo · PR #208, F1) ─────────────────────────────────────
          # Same shape + precedent as run-calendar-month above: prove a CLIENT cache is actually CONSULTED
          # on the ship path (a class the pure-module tests cannot see — the P2 F1 that ตู๋ flagged). Counts
          # GET /api/chinese-horoscope across a client-side tab-switch; backend-independent by construction
          # (identity row + chart + home-fortune all stubbed via route interception, same as the calendar
          # anchor). Teeth proven: ตู๋ fired 3 mutants each RED on a different line (neuter peek · drop
          # setChart · isChartFresh→!!c). Its own positive control (full reload MUST re-fetch) proves the
          # counter is live, so a green here is a green that could have been red.
          # 🔴 PLACED BEFORE capture-coming-soon.ts ON PURPOSE (ตู๋ 2026-08-08): GH runs `bash -e`, so the
          # FIRST harness that fails/times-out kills the whole step and every harness after it never runs —
          # capture-coming-soon has timed out at 30s in a real run (31136373508), which would silently drop
          # this gate if it sat behind it. Earlier = this gate is seen before a downstream flake can mask it.
          HARNESS_HOST=http://localhost:3000 npx tsx harness/run-home-chart-cache.ts
          CCCODE=$?
          # coming-soon controls (บอง 2026-08-06): its ledger entry names harness/capture-coming-soon.ts as
          # enforced_by — the third ledger in one day promising a guard nothing ran. Wired instead of
          # un-promised because it is genuinely ready: backend-independent, and it already exits non-zero on
          # failure. A screenshot cannot show whether a tap PRODUCES anything, which is the one thing it checks.
          HARNESS_HOST=http://localhost:3000 npx tsx harness/capture-coming-soon.ts
          CSCODE=$?
          # ── P1 home-skeleton gates (μุน · P4 items 6+9) ─────────────────────────────────────────────
          # These two shipped in #206 with NOTHING running them — the same shape this file already carries
          # three notes about. A whole day of decisions rested on first-frame-v2's numbers; a tool nobody
          # runs is a tool that rots quietly and is then cited after it has stopped working.
          #
          # Both are backend-independent by construction (gate cookie + a uuid MEMBER_ID; /api/user is
          # expected to fail here and the hook's state table resolves to home+fallback), which is why ตู๋
          # nominated verify-home-skeleton as the first to hang: it has proven teeth (mutant C) and needs
          # no environment work.
          #
          # 🔴 WIDTHS ARE PINNED, never left to the script default. DoD 2 of the P4 card requires all six,
          # and the default is only 393,360,320 — hanging it bare would gate on half the set while reading
          # like full coverage.
          HARNESS_HOST=http://localhost:3000 npx tsx harness/verify-home-skeleton.ts --widths 320,360,393,430,768,1280
          HSCODE=$?
          # first-frame asserts DIRECTION only (0 vs >0), which is all its exit code encodes. Its frame
          # COUNTS are not portable across machines — see the header of features/v2-home/components/
          # HomeSkeleton.tsx for why (the gate's duration is the failure latency of a dead DB connection,
          # which varied 0.01s–11.9s on one machine). Never gate on a count here.
          HARNESS_HOST=http://localhost:3000 npx tsx harness/first-frame-v2.ts
          FFCODE=$?
          # ⚠️ NOT WIRED, and stated out loud rather than silently omitted: harness/skeleton-shift.ts.
          # It compares the loading render against the LOADED one, and it drives /v2/home-preview, a
          # dev-only route that returns notFound under `next start`. Both halves fail here: no preview
          # route, and no database to produce a real fortune for the loaded side. Wiring it anyway would
          # produce a gate that either 404s or measures the skeleton against itself and reports 0px — a
          # pass earned by having nothing to compare. It stays a local command until it has a real
          # fixture; the P4 PR body carries its numbers, measured by hand, labelled as hand-run.
          kill "$SERVER" 2>/dev/null || true
          # Fail the job if ANY gate failed. ⚠️ #190 and #191 each extended THIS line and conflicted here.
          # Taking one side is the fastest way through the conflict and is the bug: the dropped anchor still
          # runs and still prints, but its exit code is discarded — a gate that looks like it bites and does
          # not. The failure would have entered through the MERGE, not through anyone's code, and nothing we
          # own watches that path. Team rule from it (บอง 2026-08-06): a conflict in a file carrying a
          # pass/fail condition is resolved by reading both sides and UNIONING them, never by picking — and
          # never in the GitHub web UI, whose result never passes through CI before it becomes the merge commit.
          [ "$CODE" -eq 0 ] && [ "$PCODE" -eq 0 ] && [ "$MCODE" -eq 0 ] && [ "$SCODE" -eq 0 ] && [ "$CSCODE" -eq 0 ] && [ "$HSCODE" -eq 0 ] && [ "$FFCODE" -eq 0 ] && [ "$CCCODE" -eq 0 ]

      # Evidence is only ever looked at when the gate is RED. `if: always()` uploaded 18.7 MB on EVERY push
      # (green included) — the sole reason artifact storage hit 3,561 MB on a 500 MB ceiling. `if: failure()`
      # uploads ONLY when a prior step failed (i.e. the gate above went red) → green pushes store nothing;
      # a red gate still ships the full bundle, unchanged.
      #   🔴 upload-fail must NOT swallow gate-fail (the family we've been killing all week): this holds by
      #   construction here — (a) on a GREEN run this step never runs, so it can never redden a passing gate;
      #   (b) on a RED run the gate is ALREADY its own failed, named step ("run splash harness …") — this
      #   upload is a separate downstream step, so if it also fails the two ring as two distinct red steps,
      #   and the gate's failure is never masked. Read the STEP NAME in the log, not the quota badge (GitHub
      #   recomputes the storage-quota flag every 6–12 h, so THIS run may still show red for quota, not gate).
      - name: upload evidence bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: design-verify-evidence
          path: harness/evidence/
          if-no-files-found: warn
