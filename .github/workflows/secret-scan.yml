name: secret-scan
# Scans the PR's commits only (not full git history) — historical secrets are handled by rotation, not by
# re-flagging here. See MUMATE-GITHUB-FLOW.md §5.
#
# #309: this used gitleaks/gitleaks-action@v2, which calls the GitHub API while it runs. On 2026-08-17 that
# call started returning "403 Resource not accessible by integration" (the action was forced onto Node 24 as
# Node 20 was deprecated, and its API usage changed) — so the gate went RED *before scanning anything*, which
# is worse than a normal red: it looks identical to "a real key leaked" on the checks list. Fix = drop the
# action and run the pinned gitleaks CLI directly. No GitHub API call ⇒ no 403; a pinned version ⇒ no surprise
# behavior change; and the permissions shrink to contents:read (checkout only). The gate stays REAL — a fake
# secret makes it RED (proven on this PR), and it can NEVER pass without actually scanning (range guard below).
on:
  pull_request:

permissions:
  contents: read # checkout only — the CLI needs no GitHub API, so no pull-requests scope is requested

env:
  GITLEAKS_VERSION: 8.24.3 # pinned — a moving tag is what changed behavior under us (#309)

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need both base.sha and head.sha present locally to scan the PR's commit range

      - name: install gitleaks (pinned, from the public release — no API token)
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "$url" | tar -xz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/gitleaks" version

      - name: gitleaks (PR commits, direct CLI — no GitHub API)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          # 🔴 A bad/empty range makes gitleaks scan 0 bytes and exit 0 — a dead gate wearing a green check.
          # Require the range to resolve to ≥1 commit, and let `git rev-list` (under set -e) fail loud on a
          # bad SHA. This is the invariant that keeps "green" meaning "actually scanned".
          set -e
          n=$(git rev-list --count "$BASE".."$HEAD")
          set +e
          echo "scanning $n PR commit(s): $BASE..$HEAD"
          if [ "$n" -lt 1 ]; then
            echo "::error::empty commit range ($BASE..$HEAD) — gitleaks would scan nothing; refusing to pass"
            exit 2
          fi

          gitleaks detect --source . --redact -v \
            --log-opts="$BASE..$HEAD" \
            --report-format json --report-path gitleaks-report.json
          code=$?

          findings=$(python3 -c "import json,sys; print(len(json.load(open('gitleaks-report.json'))))" 2>/dev/null || echo 0)

          if [ "$code" -eq 0 ]; then
            echo "✅ gitleaks: scanned $n PR commit(s), no leaks found"
            exit 0
          fi
          if [ "$findings" -gt 0 ]; then
            # A real (or fake-but-matching) secret was found in the PR's commits. This is the gate biting.
            echo "::error::gitleaks found $findings potential secret(s) in the PR commits — ล้มเพราะเจอความลับ. Rotate & remove; do not merge."
            exit 1
          fi
          # Non-zero exit with NO findings written = the tool itself failed to complete the scan. This is the
          # #309 class: report it as a TOOL failure, distinct from a leak, but still RED (never silently pass).
          echo "::error::gitleaks exited $code but wrote no findings — the scan did NOT complete (ล้มเพราะเครื่องมือพัง ไม่ใช่เจอความลับ). Fix the tool, do not bypass."
          exit "$code"
