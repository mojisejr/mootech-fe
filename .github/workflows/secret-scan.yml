name: secret-scan
# Scans the PR's commits only (not full git history) — historical secrets are
# handled by rotation, not by re-flagging here. See MUMATE-GITHUB-FLOW.md §5.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: read # gitleaks-action lists PR commits via the pulls API

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs history to compute the PR commit range (still scans PR commits only)
      - name: gitleaks (PR diff)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The SCAN is unchanged — this only turns OFF the post-scan SARIF *artifact upload*, which was
          # failing the whole job on the storage-quota, NOT on a leak (log: "no leaks found"). This is the
          # action's own documented switch (default true); it does NOT touch detection or the exit code, so
          # gitleaks still goes RED when a real secret is found. NOT continue-on-error / || true — those would
          # silence the guard; this silences only an artifact nobody reads on a clean scan.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
