name: ci
# Hard Gate on every PR — runs BEFORE merge (merge into main = production deploy).
# See MUMATE-GITHUB-FLOW.md §7. Note: `next lint` is NOT used (eslint not installed);
# tsc --noEmit is the static gate.
on:
  pull_request:

permissions:
  contents: read

jobs:
  hard-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: tests
        run: |
          for f in scripts/*.test.ts; do
            echo "== $f"
            npx tsx "$f"
          done

      - name: D2 Auto-Gate (Presence & Architecture)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "== Checking for verify-evidence.md =="
          git fetch origin main
          # --no-renames is LOAD-BEARING (ตู๋ #199): git sees `git mv a b` as a RENAME (one entry, the
          # DEST path) — so a rename would show 0 files outside workflows AND 0 deletions, slipping BOTH
          # guards below. --no-renames splits every rename into a DELETE(old)+ADD(new), so:
          #   git mv ci.yml → ci.yml.disabled  → old ci.yml shows as a DELETED workflow (guard b catches it)
          #   git mv features/x.ts → workflows/x.ts → old features/x.ts shows outside workflows (guard a)
          CHANGED=$(git diff --name-only --no-renames origin/main...HEAD)
          EVIDENCE_FILE=$(echo "$CHANGED" | grep -i "verify-evidence\.md" | head -n 1)

          if [ -n "$EVIDENCE_FILE" ]; then
            # NORMAL PATH — evidence present → validate it. Works for ANY PR (a workflow-only PR MAY still
            # attach full evidence and pass here; that is what this very PR does — it does not use the exemption).
            echo "== Validating verify-evidence.md content =="
            if ! grep -iq "## proof-of-teeth" "$EVIDENCE_FILE"; then
              echo "❌ ERROR: verify-evidence.md is missing the '## proof-of-teeth' section."; exit 1
            fi
            if ! grep -iq "## adversary sign-off" "$EVIDENCE_FILE"; then
              echo "❌ ERROR: verify-evidence.md is missing the '## adversary sign-off' section."; exit 1
            fi
            echo "== Running Ledger Integrity Check =="
            npx tsx scripts/verify-ledger-integrity.ts harness/bug-ledger/ "$EVIDENCE_FILE"
          else
            # NARROW EXEMPTION — a change that touches ONLY .github/workflows/** has no screen to photograph.
            # It is exempt from the evidence FILE, but NOT from speaking: the PR body must carry a
            # '## why-no-evidence' section. Two guards keep this from becoming a hole:
            #   (a) any file outside .github/workflows/ → not exempt (attach evidence)
            #   (b) DELETING a workflow file → NEVER exempt: removing a gate is the highest-stakes change and
            #       must carry full evidence, else a PR that rips out a gate would pass free.
            echo "== No verify-evidence.md — checking the narrow workflow-config-only exemption =="
            NON_WF=$(echo "$CHANGED" | grep -v '^\.github/workflows/' | grep -c . || true)
            DELETED_WF=$(git diff --name-only --diff-filter=D --no-renames origin/main...HEAD | grep -c '^\.github/workflows/' || true)
            if [ "$NON_WF" -ne 0 ]; then
              echo "❌ ERROR: No verify-evidence.md, and this PR changes $NON_WF file(s) outside .github/workflows/. Attach evidence."; exit 1
            fi
            if [ "$DELETED_WF" -ne 0 ]; then
              echo "❌ ERROR: This PR DELETES $DELETED_WF workflow file(s). Removing a gate requires a full verify-evidence.md, not the config-only exemption."; exit 1
            fi
            if ! printf '%s' "$PR_BODY" | grep -iq '## why-no-evidence'; then
              echo "❌ ERROR: workflow-config-only PR must include a '## why-no-evidence' section in the PR body (what changed · why nothing to photograph · what still bites)."; exit 1
            fi
            echo "✅ workflow-config-only change; '## why-no-evidence' present in PR body. Exempt from the evidence FILE — NOT from speaking."
          fi

          echo "== Running Architecture & Discovery Check =="
          npx tsx scripts/verify-architecture.ts

      - name: build
        run: npm run build
        env:
          # Placeholders only — NO real secrets in CI.
          # These are publicRuntimeConfig (runtime), build just needs them defined.
          ENVIRONMENT: production
          HOST: https://example.invalid
          NEXTAUTH_URL: https://example.invalid
          OMISE_PUBLIC_KEY: pkey_test_placeholder
