name: ci
# Hard Gate on every PR — runs BEFORE merge (merge into main = production deploy).
# See MUMATE-GITHUB-FLOW.md §7. Note: `next lint` is NOT used (eslint not installed);
# tsc --noEmit is the static gate.
#
# Phase 1 (goo, 2026-08-07): the D2 evidence-gate is REMOVED — no PR is required to attach a
# *.verify-evidence.md or a '## why-no-evidence' section anymore. What was load-bearing INSIDE that
# step is kept as its own gate: `verify-architecture` (BUG-001 tailwind JIT) is now a first-class step, and a
# lean `workflow-integrity` guard goes RED only when a workflow file is deleted/renamed. Bug-catching gates
# (tsc · scripts/*.test.ts · verify-architecture · build · workflow-integrity) are unchanged in force.
on:
  pull_request:

permissions:
  contents: read

jobs:
  hard-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: record CI start time
        run: echo "CI_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: tests
        # Two lanes (issue #210): vitest for migrated specs, tsx for the legacy node:assert scripts.
        # Both lanes AGGREGATE — every file runs even if an earlier one is red, so a PR that breaks two
        # test files shows BOTH reds in one CI run. The old `for … + bash -e` killed the loop at the first
        # red, hiding every failure after it (issue #210 DoD: two files red → see both). `failed` is set on
        # any red and the step exits non-zero at the very end.
        run: |
          failed=0
          # lane 1 — vitest (real framework; see vitest.config.mts include list)
          if ! npm test; then failed=1; echo "::error::vitest suite failed"; fi
          # lane 2 — legacy node:assert scripts still on tsx (issue #210: not migrated; convert
          # opportunistically). Skip specs owned by vitest — they import from 'vitest' and would throw
          # under tsx. Keep this skip list in sync with vitest.config.mts `include`.
          for f in scripts/*.test.ts; do
            [ "$f" = "scripts/logout-clears-caches.test.ts" ] && continue
            echo "== $f"
            if ! npx tsx "$f"; then failed=1; echo "::error file=$f::tsx test failed"; fi
          done
          [ "$failed" -eq 0 ]

      - name: architecture & discovery check
        # Was folded into the old D2 step but ran OUTSIDE its if/else — i.e. on every PR regardless of
        # evidence. It catches real bugs (BUG-001 tailwind JIT arbitrary default props), so it stays a
        # first-class gate now that D2 is gone.
        run: npx tsx scripts/verify-architecture.ts

      - name: workflow-integrity guard (a workflow file deleted/renamed must be deliberate)
        # RED when this PR deletes or RENAMES any .github/workflows/*.yml, UNLESS the PR body carries an
        # '## intentional-workflow-change' heading. Silent for every PR that does not touch workflows.
        # SCOPE (ตู๋ F2): guards the FILE existing, NOT the gate keeping its teeth — a PR can still neuter a
        # gate in place (gut steps · flip `on:` · `if: false` · `|| true`) and stay green. Named accordingly
        # so no one over-trusts it. Teeth proven in scripts/guard-workflow-integrity.test.ts (`tests` step).
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git fetch origin main
          BASE_REF=origin/main npx tsx scripts/guard-workflow-integrity.ts

      - name: build
        run: npm run build
        env:
          # Placeholders only — NO real secrets in CI.
          # These are publicRuntimeConfig (runtime), build just needs them defined.
          ENVIRONMENT: production
          HOST: https://example.invalid
          NEXTAUTH_URL: https://example.invalid
          OMISE_PUBLIC_KEY: pkey_test_placeholder

      - name: CI duration (warn over 5 min — never fails the build)
        if: always()
        run: |
          END=$(date +%s)
          START="${CI_START:-$END}"
          ELAPSED=$(( END - START ))
          MIN=$(( ELAPSED / 60 )); SEC=$(( ELAPSED % 60 ))
          echo "⏱️  CI took ${MIN}m ${SEC}s (${ELAPSED}s)"
          if [ "$ELAPSED" -gt 300 ]; then
            echo "::warning::CI exceeded 5 min (${MIN}m ${SEC}s) — consider trimming the gate."
          fi
