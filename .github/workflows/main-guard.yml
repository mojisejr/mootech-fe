name: main-guard
# TRIPWIRE on direct pushes to main. The 3 existing workflows (ci · design-verify · secret-scan) all trigger on
# `pull_request` only, so a direct push to main runs NOTHING — on 2026-07-29 main sat red ~20 min unnoticed.
# This runs whenever main MOVES and goes red loudly if (A) main fails tsc, or (B) main was
# moved by a direct push instead of a PR merge.
#
# NOT a required status check — it observes main after the fact; making it required would block unrelated PRs.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  integrity: # job A — main must always pass tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: typecheck (tsc --noEmit)
        run: npx tsc --noEmit

  provenance: # job B — HEAD on main must be a GitHub PR-merge commit, not a direct push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # need HEAD + its parents to count them
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: assert HEAD is a PR merge-commit (names the pusher if not)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
        run: npx tsx scripts/assert-main-provenance.ts
